name: CodeQL

# Prumo is one language: TypeScript on Node, plus the plain-Node tooling in
# ferramental/. No matrix, because a matrix with one entry is a matrix someone
# will add Python to by accident.
#
# CodeQL is not the credential gate. The rules that actually protect the vault
# are dependency-cruiser boundaries and the planted cases in
# `ferramental/portao/` — CodeQL finds injection and taint patterns that no
# rule was written for, which is a different job.
#
# No repository secret is used here, so a fork PR runs the same analysis it
# would on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the value of a scheduled run is new queries against
    # unchanged code — a vulnerability class published after the code was
    # merged is exactly what a per-push run cannot find.
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Publishes findings to the Security tab. On a pull request from a fork
      # GitHub downgrades this to read and the upload is skipped — the analysis
      # still runs and still fails the check, only the Security tab entry is
      # missing. That is the fork clause working, not a misconfiguration.
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # No build needed: CodeQL extracts TypeScript directly. Running the
          # real build here would mean executing dependency install scripts
          # from a fork PR, which is the thing this repository refuses to do.
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
