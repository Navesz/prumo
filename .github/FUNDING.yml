# Sponsorship is optional and buys nothing: it does not move an issue up the
# queue, and it does not create a support obligation. SUPPORT.md describes what
# is actually offered.
#
# Prumo takes no cut of generation spend — the money goes straight from the
# user's own API key to the provider. There is no revenue to disclose here.

github: [Navesz]

# Unused platforms are kept commented rather than deleted so that adding one
# later is a one-line change with the correct key name already present. GitHub
# ignores a key set to an empty value, but an unreviewed link asking strangers
# for money is worse than no link.
#
# patreon: # a single Patreon username
# open_collective: # a single Open Collective slug
# ko_fi: # a single Ko-fi username
# tidelift: # platform-name/package-name
# community_bridge: # a single LFX Mentorship project slug
# liberapay: # a single Liberapay username
# issuehunt: # a single IssueHunt username
# lfx_mentorship: # a single LFX Mentorship slug
# polar: # a single Polar username
# buy_me_a_coffee: # a single Buy Me a Coffee username
# thanks_dev: # a single thanks.dev username
# custom: # up to 4 custom URLs
